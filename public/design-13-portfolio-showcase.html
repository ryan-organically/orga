<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Design 13: Portfolio-Showcase Focus | Organically</title>
  <meta content="Portfolio-driven homepage concept for Organically - work-first, visual-heavy design." name="description">
  <meta content="width=device-width, initial-scale=1" name="viewport">

  <link href="/css/normalize.css" rel="stylesheet" type="text/css">
  <link href="/css/webflow.css" rel="stylesheet" type="text/css">
  <link href="/css/organicallyseo-com.webflow.css?v=2" rel="stylesheet" type="text/css">

  <link href="https://fonts.googleapis.com" rel="preconnect">
  <link href="https://fonts.gstatic.com" rel="preconnect" crossorigin="anonymous">
  <script src="https://ajax.googleapis.com/ajax/libs/webfont/1.6.26/webfont.js" type="text/javascript"></script>
  <script type="text/javascript">
    window.fontsLoaded = false;
    WebFont.load({
      google: {
        families: ["Vollkorn:400,400italic,700,700italic","Lato:100,100italic,300,300italic,400,400italic,700,700italic,900,900italic","Oswald:200,300,400,500,600,700"]
      },
      active: function() {
        window.fontsLoaded = true;
        document.dispatchEvent(new Event('fontsReady'));
      }
    });
  </script>

  <link href="/images/favicon.jpg" rel="shortcut icon" type="image/x-icon">
  <link href="/images/webclip.jpg" rel="apple-touch-icon">

  <!-- React 18 (UMD builds) -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- GSAP for scroll animations -->
  <script src="https://cdn.prod.website-files.com/gsap/3.13.0/gsap.min.js" type="text/javascript"></script>
  <script src="https://cdn.prod.website-files.com/gsap/3.13.0/ScrollTrigger.min.js" type="text/javascript"></script>

  <style>
    /* ================================================================
       DESIGN 13 — PORTFOLIO-SHOWCASE FOCUS 2026
       Work-driven, visual-heavy homepage
       ================================================================ */

    :root {
      --d13-bg: #e2e2e2;
      --d13-surface: #f0f0ee;
      --d13-card-bg: #fafaf8;
      --d13-text: #0e0f19;
      --d13-text-muted: #0009;
      --d13-accent: #7ec700;
      --d13-accent-dim: #7ec70040;
      --d13-border: #0006;
      --d13-border-light: #00000015;
      --d13-white: #fff;
      --d13-red: #e83151;
      --d13-blue: #009fb7;
      --d13-gold: #ffb612;
      --d13-dark: #0e0f19;
      --d13-overlay: rgba(14, 15, 25, 0.85);
      --d13-radius: 6px;
      --d13-radius-lg: 12px;
      --d13-transition: 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    /* ---- Reset for this page ---- */
    .d13-page {
      background: var(--d13-bg);
      color: var(--d13-text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    .d13-page *,
    .d13-page *::before,
    .d13-page *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* ================================================================
       HERO — 50vh, simplified
       ================================================================ */
    .d13-hero {
      height: 50vh;
      min-height: 400px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 5vw;
      position: relative;
      overflow: hidden;
      border-bottom: 1px solid var(--d13-border-light);
    }

    .d13-hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse at 20% 50%, var(--d13-accent-dim) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 50%, rgba(0,159,183,0.08) 0%, transparent 60%);
      pointer-events: none;
    }

    .d13-hero-h1 {
      font-family: 'Coolvetica Rg', 'Oswald', sans-serif;
      font-size: clamp(3rem, 8vw, 7rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.05;
      margin-bottom: 0.4em;
      position: relative;
    }

    .d13-hero-h1 .d13-period {
      color: var(--d13-accent);
    }

    .d13-hero-subtitle {
      font-size: clamp(1rem, 2vw, 1.25rem);
      color: var(--d13-text-muted);
      max-width: 500px;
      margin-bottom: 2rem;
      line-height: 1.6;
    }

    .d13-hero-cta {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 14px 36px;
      background: var(--d13-accent);
      color: var(--d13-dark);
      font-weight: 700;
      font-size: 0.95rem;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      text-decoration: none;
      border: none;
      border-radius: var(--d13-radius);
      cursor: pointer;
      transition: transform var(--d13-transition), box-shadow var(--d13-transition);
    }

    .d13-hero-cta:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(126, 199, 0, 0.3);
    }

    .d13-hero-cta-arrow {
      font-size: 1.2em;
      transition: transform 0.25s ease;
    }

    .d13-hero-cta:hover .d13-hero-cta-arrow {
      transform: translateX(4px);
    }

    /* ================================================================
       PORTFOLIO FILTER BAR
       ================================================================ */
    .d13-filter-bar {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      padding: 24px 5vw;
      border-bottom: 1px solid var(--d13-border-light);
      flex-wrap: wrap;
      position: sticky;
      top: 0;
      z-index: 50;
      background: var(--d13-bg);
      backdrop-filter: blur(12px);
    }

    .d13-filter-btn {
      padding: 8px 22px;
      background: transparent;
      border: 1px solid var(--d13-border);
      border-radius: 100px;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all var(--d13-transition);
      color: var(--d13-text-muted);
      white-space: nowrap;
    }

    .d13-filter-btn:hover {
      border-color: var(--d13-accent);
      color: var(--d13-text);
    }

    .d13-filter-btn[data-active="true"] {
      background: var(--d13-text);
      color: var(--d13-white);
      border-color: var(--d13-text);
    }

    /* ================================================================
       PORTFOLIO GRID — full-width, dominant
       ================================================================ */
    .d13-portfolio-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 2px;
      padding: 2px;
      min-height: 60vh;
    }

    @media (max-width: 767px) {
      .d13-portfolio-grid {
        grid-template-columns: 1fr;
      }
    }

    /* ---- Portfolio Card ---- */
    .d13-project-card {
      position: relative;
      overflow: hidden;
      cursor: pointer;
      aspect-ratio: 4 / 3;
      background: var(--d13-surface);
    }

    .d13-project-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    .d13-project-card:hover img {
      transform: scale(1.04);
    }

    /* Base info — always visible */
    .d13-project-info {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 28px 24px;
      background: linear-gradient(0deg, rgba(14,15,25,0.75) 0%, transparent 100%);
      color: var(--d13-white);
      transition: opacity var(--d13-transition);
    }

    .d13-project-title {
      font-family: 'Coolvetica Rg', 'Oswald', sans-serif;
      font-size: clamp(1.1rem, 2.5vw, 1.5rem);
      font-weight: 600;
      margin-bottom: 4px;
    }

    .d13-project-category {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      opacity: 0.75;
    }

    /* Hover overlay — reveals year, tech, results */
    .d13-project-hover {
      position: absolute;
      inset: 0;
      background: var(--d13-overlay);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 30px;
      color: var(--d13-white);
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    .d13-project-card:hover .d13-project-hover {
      opacity: 1;
    }

    .d13-project-card:hover .d13-project-info {
      opacity: 0;
    }

    .d13-hover-title {
      font-family: 'Coolvetica Rg', 'Oswald', sans-serif;
      font-size: clamp(1.3rem, 3vw, 1.75rem);
      font-weight: 700;
      margin-bottom: 8px;
    }

    .d13-hover-category {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      opacity: 0.6;
      margin-bottom: 20px;
    }

    .d13-hover-meta {
      display: flex;
      flex-direction: column;
      gap: 10px;
      font-size: 0.85rem;
      margin-bottom: 20px;
    }

    .d13-hover-meta-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .d13-hover-meta-label {
      font-weight: 700;
      text-transform: uppercase;
      font-size: 0.7rem;
      letter-spacing: 0.08em;
      opacity: 0.5;
      min-width: 65px;
      text-align: right;
    }

    .d13-hover-meta-value {
      opacity: 0.9;
    }

    .d13-hover-result {
      margin-top: 8px;
      padding: 8px 18px;
      background: var(--d13-accent);
      color: var(--d13-dark);
      font-weight: 700;
      font-size: 0.8rem;
      letter-spacing: 0.03em;
      border-radius: 100px;
    }

    .d13-hover-cta {
      margin-top: 14px;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      opacity: 0.6;
      border-bottom: 1px solid rgba(255,255,255,0.3);
      padding-bottom: 2px;
    }

    /* Service tag pills on hover */
    .d13-project-services {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 14px;
    }

    .d13-service-pill {
      padding: 4px 12px;
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 100px;
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      opacity: 0.7;
    }

    /* Animation: stagger-in on scroll */
    .d13-project-card {
      opacity: 0;
      transform: translateY(30px);
    }

    .d13-project-card.d13-visible {
      opacity: 1;
      transform: translateY(0);
      transition: opacity 0.6s ease, transform 0.6s ease;
    }

    /* ================================================================
       LIGHTBOX
       ================================================================ */
    .d13-lightbox-overlay {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: rgba(14, 15, 25, 0.92);
      backdrop-filter: blur(8px);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }

    .d13-lightbox-overlay[data-open="true"] {
      opacity: 1;
      visibility: visible;
    }

    .d13-lightbox-close {
      position: absolute;
      top: 24px;
      right: 32px;
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: none;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 50%;
      cursor: pointer;
      color: var(--d13-white);
      font-size: 1.5rem;
      transition: border-color 0.25s ease;
      z-index: 10;
    }

    .d13-lightbox-close:hover {
      border-color: var(--d13-accent);
    }

    .d13-lightbox-content {
      width: 100%;
      max-width: 1100px;
      max-height: 90vh;
      overflow-y: auto;
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 0;
      background: var(--d13-card-bg);
      border-radius: var(--d13-radius-lg);
      overflow: hidden;
      transform: translateY(20px) scale(0.97);
      transition: transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    .d13-lightbox-overlay[data-open="true"] .d13-lightbox-content {
      transform: translateY(0) scale(1);
    }

    .d13-lightbox-image {
      position: relative;
      min-height: 400px;
    }

    .d13-lightbox-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .d13-lightbox-testimonial {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 24px;
      background: linear-gradient(0deg, rgba(14,15,25,0.8) 0%, transparent 100%);
      color: var(--d13-white);
    }

    .d13-lightbox-quote {
      font-style: italic;
      font-size: 0.9rem;
      line-height: 1.6;
      opacity: 0.9;
      margin-bottom: 8px;
    }

    .d13-lightbox-author {
      font-size: 0.75rem;
      opacity: 0.6;
      font-weight: 600;
    }

    .d13-lightbox-details {
      padding: 40px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .d13-lightbox-details h2 {
      font-family: 'Coolvetica Rg', 'Oswald', sans-serif;
      font-size: 1.75rem;
      font-weight: 700;
      line-height: 1.15;
    }

    .d13-lightbox-details h2 .d13-period {
      color: var(--d13-accent);
    }

    .d13-lightbox-category-badge {
      display: inline-block;
      padding: 4px 14px;
      border-radius: 100px;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 700;
      width: fit-content;
    }

    .d13-lightbox-category-badge[data-type="Web Design"] {
      background: rgba(255, 182, 18, 0.15);
      color: #b88200;
    }
    .d13-lightbox-category-badge[data-type="SEO"] {
      background: rgba(126, 199, 0, 0.15);
      color: #5a9100;
    }
    .d13-lightbox-category-badge[data-type="Branding"] {
      background: rgba(232, 49, 81, 0.15);
      color: #c22040;
    }
    .d13-lightbox-category-badge[data-type="Development"] {
      background: rgba(0, 159, 183, 0.15);
      color: #007a8c;
    }

    .d13-lightbox-description {
      font-size: 0.95rem;
      line-height: 1.7;
      color: var(--d13-text-muted);
    }

    .d13-lightbox-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      padding: 16px 0;
      border-top: 1px solid var(--d13-border-light);
      border-bottom: 1px solid var(--d13-border-light);
    }

    .d13-lightbox-stat {
      text-align: center;
    }

    .d13-lightbox-stat-value {
      font-family: 'Coolvetica Rg', 'Oswald', sans-serif;
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--d13-accent);
    }

    .d13-lightbox-stat-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--d13-text-muted);
      margin-top: 2px;
    }

    .d13-lightbox-tech {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .d13-lightbox-tech-tag {
      padding: 5px 14px;
      background: var(--d13-bg);
      border-radius: 100px;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--d13-text-muted);
    }

    .d13-lightbox-services-applied {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .d13-lightbox-service-tag {
      padding: 6px 16px;
      border: 1px solid var(--d13-border);
      border-radius: var(--d13-radius);
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .d13-lightbox-cta {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 28px;
      background: var(--d13-accent);
      color: var(--d13-dark);
      font-weight: 700;
      font-size: 0.85rem;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      text-decoration: none;
      border: none;
      border-radius: var(--d13-radius);
      cursor: pointer;
      width: fit-content;
      transition: transform var(--d13-transition);
    }

    .d13-lightbox-cta:hover {
      transform: translateY(-1px);
    }

    @media (max-width: 767px) {
      .d13-lightbox-overlay {
        padding: 16px;
      }

      .d13-lightbox-content {
        grid-template-columns: 1fr;
        max-height: 85vh;
      }

      .d13-lightbox-image {
        min-height: 220px;
        max-height: 260px;
      }

      .d13-lightbox-details {
        padding: 24px;
      }

      .d13-lightbox-stats {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    /* ================================================================
       SERVICES APPLIED SECTION (inline with portfolio)
       ================================================================ */
    .d13-services-strip {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0;
      border-top: 1px solid var(--d13-border-light);
      border-bottom: 1px solid var(--d13-border-light);
    }

    .d13-service-card {
      padding: 40px 28px;
      text-align: center;
      border-right: 1px solid var(--d13-border-light);
      transition: background var(--d13-transition);
    }

    .d13-service-card:last-child {
      border-right: none;
    }

    .d13-service-card:hover {
      background: var(--d13-surface);
    }

    .d13-service-icon {
      width: 44px;
      height: 44px;
      margin: 0 auto 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      font-size: 1.2rem;
    }

    .d13-service-icon[data-color="gold"] { background: rgba(255,182,18,0.15); }
    .d13-service-icon[data-color="green"] { background: rgba(126,199,0,0.15); }
    .d13-service-icon[data-color="red"] { background: rgba(232,49,81,0.15); }
    .d13-service-icon[data-color="blue"] { background: rgba(0,159,183,0.15); }

    .d13-service-name {
      font-family: 'Coolvetica Rg', 'Oswald', sans-serif;
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .d13-service-count {
      font-size: 0.75rem;
      color: var(--d13-text-muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    @media (max-width: 767px) {
      .d13-services-strip {
        grid-template-columns: repeat(2, 1fr);
      }

      .d13-service-card:nth-child(2) {
        border-right: none;
      }

      .d13-service-card:nth-child(-n+2) {
        border-bottom: 1px solid var(--d13-border-light);
      }
    }

    /* ================================================================
       TESTIMONIALS — pull quotes on project images
       ================================================================ */
    .d13-testimonials {
      padding: 60px 5vw;
    }

    .d13-testimonials-heading {
      font-family: 'Coolvetica Rg', 'Oswald', sans-serif;
      font-size: clamp(1.5rem, 3vw, 2rem);
      text-align: center;
      margin-bottom: 40px;
    }

    .d13-testimonials-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }

    .d13-testimonial-card {
      position: relative;
      aspect-ratio: 3 / 2;
      border-radius: var(--d13-radius-lg);
      overflow: hidden;
    }

    .d13-testimonial-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: brightness(0.5);
    }

    .d13-testimonial-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 28px;
      color: var(--d13-white);
    }

    .d13-testimonial-quote {
      font-style: italic;
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 12px;
      opacity: 0.95;
    }

    .d13-testimonial-quote::before {
      content: '\201C';
      font-size: 2rem;
      line-height: 0;
      vertical-align: -0.4em;
      margin-right: 4px;
      color: var(--d13-accent);
    }

    .d13-testimonial-attribution {
      font-size: 0.8rem;
      font-weight: 700;
      opacity: 0.7;
    }

    .d13-testimonial-stars {
      margin-bottom: 10px;
      font-size: 0.9rem;
      color: var(--d13-gold);
      letter-spacing: 2px;
    }

    @media (max-width: 991px) {
      .d13-testimonials-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .d13-testimonial-card:last-child {
        grid-column: span 2;
        aspect-ratio: 2 / 1;
      }
    }

    @media (max-width: 600px) {
      .d13-testimonials-grid {
        grid-template-columns: 1fr;
      }

      .d13-testimonial-card:last-child {
        grid-column: span 1;
        aspect-ratio: 3 / 2;
      }
    }

    /* ================================================================
       BLOG SECTION — 3 latest posts, secondary
       ================================================================ */
    .d13-blog-section {
      padding: 60px 5vw;
      background: var(--d13-surface);
      border-top: 1px solid var(--d13-border-light);
    }

    .d13-blog-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 32px;
    }

    .d13-blog-heading {
      font-family: 'Coolvetica Rg', 'Oswald', sans-serif;
      font-size: clamp(1.3rem, 2.5vw, 1.75rem);
      font-weight: 600;
    }

    .d13-blog-see-all {
      font-size: 0.85rem;

        return () => clearTimeout(timer);
      }, [index]);

      return (
        <div
          ref={ref}
          className="d13-project-card"
          onClick={() => onClick(project)}
          role="button"
          tabIndex={0}
          onKeyDown={(e) => { if (e.key === 'Enter') onClick(project); }}

    function Lightbox({ project, onClose }) {
      const isOpen = project !== null;

      // Close on ESC
      useEffect(() => {
        function handleKey(e) {
          if (e.key === 'Escape') onClose();
        }
        if (isOpen) {
          document.addEventListener('keydown', handleKey);
          document.body.style.overflow = 'hidden';
        }
        return () => {
          document.removeEventListener('keydown', handleKey);
          document.body.style.overflow = '';
        };
      }, [isOpen, onClose]);

      return (
        <div
          className="d13-lightbox-overlay"
          data-open={isOpen ? "true" : "false"}
          onClick={(e) => {
            if (e.target === e.currentTarget) onClose();
          }}

          <button className="d13-lightbox-close" onClick={onClose} aria-label="Close lightbox">

          </nav>
          <div className="d13-footer-copy">
            Copyright 2026 Organically SEO. All rights reserved.
          </div>
        </footer>
      );
    }

    // ----------------------------------------------------------------
    // MAIN APP
    // ----------------------------------------------------------------
    function PortfolioHomepage() {
      const [activeFilter, setActiveFilter] = useState("All");
      const [lightboxProject, setLightboxProject] = useState(null);

      const filteredProjects = activeFilter === "All"
        ? PROJECTS
        : PROJECTS.filter(p => p.category === activeFilter);

      const handleFilterChange = useCallback((cat) => {
        setActiveFilter(cat);
      }, []);

      const handleProjectClick = useCallback((project) => {
        setLightboxProject(project);
      }, []);

      const handleLightboxClose = useCallback(() => {
        setLightboxProject(null);
      }, []);

      return (
        <>
          <Hero />
          <FilterBar activeFilter={activeFilter} onFilterChange={handleFilterChange} />
          <PortfolioGrid projects={filteredProjects} onProjectClick={handleProjectClick} />
          <Lightbox project={lightboxProject} onClose={handleLightboxClose} />
          <ServicesStrip />
          <Testimonials />
          <BlogSection />
          <Footer />
        </>
      );
    }

    // ----------------------------------------------------------------
    // MOUNT
    // ----------------------------------------------------------------
    const root = ReactDOM.createRoot(document.getElementById('d13-app'));
    root.render(<PortfolioHomepage />);
  </script>

</body>
</html>
